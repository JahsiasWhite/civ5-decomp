# Server tests on every push and pull request. The VPS only deploys commits on main
# whose "tests" workflow passed (see deploy/autodeploy.py).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest -r requirements.txt    # capstone, for tests/test_boundaries.py
      - run: python -m pytest -q tests

  # A boundary fix changes the function list, so the files derived from it with the game
  # (`c5d scope`, `c5d queue`, `c5d fingerprint`) must be regenerated in the same PR.
  boundary-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerated data comes with boundary fixes
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          if echo "$changed" | grep -qx "boundary_overrides.txt"; then
            missing=""
            for f in data/callgraph.csv data/fingerprints.csv; do
              echo "$changed" | grep -qx "$f" || missing="$missing $f"
            done
            if [ -n "$missing" ]; then
              echo "::error file=boundary_overrides.txt::boundary_overrides.txt changed but not:$missing. Run \`python tools/c5d.py scope\`, \`queue\` and \`fingerprint\` and commit the results."
              exit 1
            fi
          fi
          echo "ok"
