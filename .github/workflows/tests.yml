# Server tests on every push and pull request. The VPS only deploys commits on main
# whose "tests" workflow passed (see deploy/autodeploy.py).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest -r requirements.txt    # capstone, for tests/test_boundaries.py
      - run: python -m pytest -q tests
